[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-decode-gate"
version = "1.0.0"
description = "VIN decoding that states how each field was resolved"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mikko-lab" }]
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[project.scripts]
vindecode-train = "vindecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"